[package]
name = "kohakuboard"
# Single source of truth for package version (pyproject.toml reads it dynamically).
version = "2.0.0"
edition = "2021"
description = "Rust logging, compute, storage, and query core for KohakuBoard"
license = "Apache-2.0"
repository = "https://github.com/KohakuBlueleaf/KohakuBoard"
autotests = false

[lib]
name = "kohakuboard_rs"
crate-type = ["cdylib", "rlib"]
path = "src/kohakuboard-rust/lib.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
kohakuvault = { git = "https://github.com/KohakuBlueleaf/KohakuVault.git", tag = "v1.2.1", default-features = false }
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py310"], optional = true }

bytemuck = { version = "1.18", features = ["derive"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

blake3 = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rustfft = "6.2"
flate2 = "1.0"

sysinfo = { version = "0.33", default-features = false, features = ["system"] }
nvml-wrapper = "0.10"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
codegen-units = 1
