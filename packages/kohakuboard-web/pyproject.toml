[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakuboard-web"
version = "2.0.0"
description = "Web dashboard and FastAPI server for KohakuBoard"
authors = [
    { name = "Shih-Ying Yeh(KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "kohakuboard>=2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
server = [
    "bcrypt>=4.0",
    "peewee>=3.17",
    "psycopg2-binary>=2.9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kohakuboard_web = ["static/**/*"]
